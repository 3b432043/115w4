<script setup>
import { ref, computed } from 'vue'

// 一、計數器
const count = ref(0)

function increment() {
  count.value++
}

function resetCount() {
  count.value = 0
}

// 二、姓名輸入與字數計算
const name = ref('')

const nameLength = computed(() => {
  return [...name.value].length
})

// 三、小計與數量驗證
const price = 150
const quantity = ref('3')

// 即時檢查輸入的數量
const message = computed(() => {
  const value = quantity.value.trim()

  if (value === '') {
    return '請輸入數量！'
  }

  const number = Number(value)

  if (
    !Number.isFinite(number) ||
    number <= 0 ||
    !Number.isInteger(number)
  ) {
    return '數量必須是正整數，不能輸入 2.5！'
  }

  return ''
})

// 數量改變時，自動重新計算金額
const subtotal = computed(() => {
  if (message.value !== '') {
    return 0
  }

  return price * Number(quantity.value)
})
</script>

<template>
  <main class="container">
    <h1>🌿 Vue 3 綜合練習</h1>
    <p class="subtitle">計數器・姓名輸入・小計計算</p>

    <div class="cards">

      <!-- 一、計數器 -->
      <section class="card">
        <h2>🔢 一、計數器</h2>

        <p>目前的數字是</p>
        <div class="number">{{ count }}</div>

        <p>計數結果：{{ count }}/{{ count * 2 }}</p>

        <button @click="increment">
          ＋ 加 1
        </button>

        <button class="secondary" @click="resetCount">
          歸零
        </button>
      </section>

      <!-- 二、姓名輸入 -->
      <section class="card">
        <h2>📝 二、姓名輸入</h2>

        <label for="name">請輸入姓名：</label>

        <input
          id="name"
          v-model="name"
          type="text"
          placeholder="例如：王小明"
        />

        <div class="number">{{ nameLength }}</div>

        <p>姓名字數：{{ nameLength }}</p>

        <button class="secondary" @click="name = ''">
          清空姓名
        </button>
      </section>

      <!-- 三、小計與交付 -->
      <section class="card">
        <h2>🧾 三、小計與交付</h2>

        <p>商品單價：{{ price }} 元</p>

        <label for="quantity">請輸入購買數量：</label>

        <input
          id="quantity"
          v-model="quantity"
          type="number"
          placeholder="請輸入正整數"
          step="1"
          min="1"
        />

        <!-- 輸入錯誤時顯示提示 -->
        <p v-if="message" class="error" role="alert">
          {{ message }}
        </p>

        <!-- 輸入正確時自動顯示小計 -->
        <div v-else class="success">
          <p>計算公式</p>
          <div class="total">
            {{ price }} × {{ quantity }} = {{ subtotal }} 元
          </div>
        </div>
      </section>

    </div>

    <footer>
      Vue 3 練習作業｜計數、輸入與計算
    </footer>
  </main>
</template>
