\```html
<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>個人介紹 | 戴嘉閒</title>
 
    <style>

        /* =========================
           全局設定
        ========================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            background-color: #f4f7f6;
            color: #333;
            min-height: 100vh;
        }


        /* =========================
           導覽列
        ========================= */

        nav {
            background-color: #2c3e50;
            padding: 15px 20px;
            text-align: center;
        }

        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .nav-btn {
            border: none;
            color: white;
            background-color: #34495e;
            padding: 10px 25px;
            border-radius: 8px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .nav-btn:hover {
            background-color: #1976d2;
            transform: translateY(-2px);
        }

        .nav-btn.active {
            background-color: #1976d2;
        }


        /* =========================
           內容區塊
        ========================= */

        .page {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;

            display: flex;
            flex-direction: row;
            justify-content: center;
            gap: 16px;
        }


        /* =========================
           卡片
        ========================= */

        .content-card {
            background-color: white;
            border-radius: 16px;

            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);

            padding: 30px;

            flex: 1;
            max-width: 500px;

            min-height: 260px;

            text-align: center;

            transition: transform 0.3s ease,
                        box-shadow 0.3s ease;
        }

        .content-card:hover {
            transform: translateY(-5px);

            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.12);
        }

        .content-card h2 {
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .content-card p {
            color: #666;
            line-height: 1.8;
        }


        /* =========================
           個人照片
        ========================= */

        .avatar-container {
            width: 120px;
            height: 120px;

            margin: 0 auto 20px;

            border-radius: 50%;
            overflow: hidden;

            border: 4px solid #eef2f5;

            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }


        /* =========================
           個人姓名
        ========================= */

        .name {
            font-size: 1.6rem;
            color: #2c3e50;
            margin-bottom: 12px;
        }


        /* =========================
           個人標籤
        ========================= */

        .tag-container {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tag {
            background-color: #e3f2fd;
            color: #1976d2;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
        }


        /* =========================
           自我介紹
        ========================= */

        .bio {
            background-color: #fafafa;
            border-left: 4px solid #1976d2;
            border-radius: 8px;
            padding: 15px;
            line-height: 1.7;
            color: #555;
            text-align: left;
        }


        /* =========================
           聯絡表單
        ========================= */

        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            color: #2c3e50;
            font-weight: bold;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: inherit;
            background-color: #fafafa;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #1976d2;
            background-color: white;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
        }


        /* =========================
           Email 錯誤提示
        ========================= */

        .email-error {
            color: red;
            font-size: 0.85rem;
            margin-top: 6px;
            display: none;
        }


        /* =========================
           送出按鈕
        ========================= */

        .submit-btn {
            width: 100%;
            padding: 12px;

            border: none;
            border-radius: 8px;

            background-color: #1976d2;
            color: white;

            font-size: 1rem;
            font-family: inherit;

            cursor: pointer;

            transition: background-color 0.3s ease;
        }

        .submit-btn:hover {
            background-color: #1565c0;
        }

        .submit-btn:disabled {
            background-color: #999;
            color: white;
            cursor: not-allowed;
        }


        /* =========================
           頁尾
        ========================= */

        footer {
            text-align: center;
            color: #888;
            font-size: 0.8rem;
            padding: 25px;
        }


        /* =========================
           手機版
        ========================= */

        @media (max-width: 767px) {

            .page {
                flex-direction: column;
                align-items: center;
                gap: 16px;
            }

            .content-card {
                width: 100%;
                max-width: 500px;
            }

        }


        /* =========================
           更小的手機螢幕
        ========================= */

        @media (max-width: 480px) {

            nav {
                padding: 12px;
            }

            .nav-buttons {
                gap: 8px;
            }

            .nav-btn {
                padding: 8px 15px;
                font-size: 0.85rem;
            }

            .page {
                margin: 25px auto;
                padding: 0 15px;
            }

            .content-card {
                padding: 25px 20px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         導覽列
    ========================= -->

    <nav>

        <div class="nav-buttons">

            <button
                class="nav-btn active"
                onclick="showPage('home', this)">
                🏠 首頁
            </button>


            <button
                class="nav-btn"
                onclick="showPage('about', this)">
                👤 個人介紹
            </button>


            <button
                class="nav-btn"
                onclick="showPage('contact', this)">
                📧 聯絡我
            </button>

        </div>

    </nav>


    <!-- =========================
         內容區
    ========================= -->

    <main class="page">


        <!-- =========================
             首頁
        ========================= -->

        <div id="home" class="content-card">

            <h2>🏠 首頁</h2>

            <p>
                你好，我是戴嘉閒！<br><br>

                歡迎來到我的個人網站。<br>

                你可以透過上方的導覽按鈕，
                查看我的個人介紹以及聯絡方式。
            </p>

        </div>


        <!-- =========================
             個人介紹
        ========================= -->

        <div id="about" class="content-card">

            <div class="avatar-container">

                <img
                    src="https://via.placeholder.com/150"
                    alt="戴嘉閒的大頭貼"
                >

            </div>


            <h2 class="name">
                戴嘉閒
            </h2>


            <div class="tag-container">

                <span class="tag">
                    🎓 國立勤益科技大學
                </span>

                <span class="tag">
                    資訊管理系
                </span>

                <span class="tag">
                    大二生
                </span>

            </div>


            <div class="bio">

                <p>
                    你好！我是戴嘉閒，目前就讀
                    國立勤益科技大學資訊管理系二年級。
                </p>

            </div>

        </div>


        <!-- =========================
             聯絡我
        ========================= -->

        <div id="contact" class="content-card">

            <h2>📧 聯絡我</h2>


            <form id="contactForm">


                <!-- 姓名 -->

                <div class="form-group">

                    <label for="name">
                        姓名
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="請輸入您的姓名"
                        required
                    >

                </div>


                <!-- Email -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="請輸入您的 Email"
                        required
                    >

                    <!-- Email 錯誤提示 -->

                    <div id="emailError" class="email-error">
                        請輸入正確的 Email 格式
                    </div>

                </div>


                <!-- 留言 -->

                <div class="form-group">

                    <label for="message">
                        留言內容
                    </label>

                    <textarea
                        id="message"
                        name="message"
                        placeholder="請輸入您想對我說的話"
                        required
                    ></textarea>

                </div>


                <!-- 送出 -->

                <button
                    type="submit"
                    class="submit-btn">
                    📩 送出留言
                </button>


            </form>

        </div>


    </main>


    <!-- =========================
         頁尾
    ========================= -->

    <footer>

        <p>
            &copy; 2026 戴嘉閒. All Rights Reserved.
        </p>

    </footer>


    <!-- =========================
         JavaScript
    ========================= -->

    <script>


        /* =========================
           頁面切換
        ========================= */

        function showPage(pageId, button) {

            const cards =
                document.querySelectorAll(".content-card");


            cards.forEach(function(card) {

                card.style.display = "none";

            });


            document.getElementById(pageId)
                .style.display = "block";


            const buttons =
                document.querySelectorAll(".nav-btn");


            buttons.forEach(function(btn) {

                btn.classList.remove("active");

            });


            button.classList.add("active");

        }


        /* =========================
           Email 即時驗證
        ========================= */

        const emailInput =
            document.getElementById("email");

        const emailError =
            document.getElementById("emailError");


        emailInput.addEventListener("input", function() {

            const email = emailInput.value.trim();


            // Email 格式檢查

            const emailPattern =
                /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


            // 空白時不顯示錯誤

            if (email === "") {

                emailError.style.display = "none";

                emailInput.style.borderColor = "#ddd";

                return;
            }


            // 格式錯誤

            if (!emailPattern.test(email)) {

                emailError.style.display = "block";

                emailInput.style.borderColor = "red";

            }

            // 格式正確

            else {

                emailError.style.display = "none";

                emailInput.style.borderColor = "#28a745";

            }

        });


        /* =========================
           表單送出
        ========================= */

        document.getElementById("contactForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();


                const name =
                    document.getElementById("name").value;

                const email =
                    document.getElementById("email").value;

                const message =
                    document.getElementById("message").value;


                // 再次確認 Email 格式

                const emailPattern =
                    /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


                if (!emailPattern.test(email)) {

                    emailError.style.display = "block";

                    emailInput.style.borderColor = "red";

                    return;

                }


                // 顯示送出訊息

                alert(
                    "留言已送出！\n\n" +
                    "姓名：" + name + "\n" +
                    "Email：" + email + "\n" +
                    "留言：" + message
                );


                // 清空表單

                this.reset();


                // 清除 Email 驗證狀態

                emailError.style.display = "none";

                emailInput.style.borderColor = "#ddd";


                // 取得送出按鈕

                const submitButton =
                    this.querySelector(".submit-btn");


                // 按鈕改成「已送出」

                submitButton.textContent = "已送出";


                // 停用按鈕

                submitButton.disabled = true;

            });


        /* =========================
           網頁開啟時只顯示首頁
        ========================= */

        window.onload = function() {

            document.getElementById("about")
                .style.display = "none";

            document.getElementById("contact")
                .style.display = "none";

            document.getElementById("home")
                .style.display = "block";

        };

    </script>


</body>

</html>
